openapi: 3.1.0

info:
  title: TradeX Order Service API
  version: 1.0.0
  description: API for creating, retrieving and cancelling orders.

servers:
  - url: http://localhost:8081

security:
  - bearerAuth: []

paths:

  /orders:
    post:
      tags:
        - Orders
      summary: Create an order
      operationId: createOrder

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'OrderCreateRequest.json'

      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: 'OrderResponse.json'

        '400':
          description: Invalid request

        '401':
          description: Unauthorized

        '403':
          description: Forbidden


  /orders/{orderId}:
    get:
      tags:
        - Orders
      summary: Get order by ID
      operationId: getOrder

      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        '200':
          description: Order retrieved successfully
          content:
            application/json:
              schema:
                $ref: 'OrderResponse.json'

        '401':
          description: Unauthorized

        '403':
          description: Forbidden

        '404':
          description: Order not found


    delete:
      tags:
        - Orders
      summary: Cancel an order
      operationId: cancelOrder

      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        '204':
          description: Order cancelled successfully

        '401':
          description: Unauthorized

        '403':
          description: Forbidden

        '404':
          description: Order not found


components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT